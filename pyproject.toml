[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skyrim-wayfinder"
version = "0.1.0"
description = "A local desktop planner for completion-oriented Skyrim playthroughs"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
skyrim-wayfinder = "skyrim_wayfinder.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skyrim_wayfinder = ["data/canonical/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
